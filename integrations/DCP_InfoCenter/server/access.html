<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCP · 设备验证</title><style>:root{color-scheme:light dark;font:14px system-ui;letter-spacing:0}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:light-dark(#f3f5f4,#181d1b);color:light-dark(#273330,#e1e8e2)}main{width:min(360px,calc(100vw - 48px))}h1{font-size:25px}p{line-height:1.7;color:light-dark(#64736a,#abb9ae)}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:6px;border:1px solid #89928d55}button{background:#228763;color:white;cursor:pointer}code{display:block;overflow-wrap:anywhere;padding:12px 0;font-size:17px}small{display:block;line-height:1.7}</style><main><p>DCP INFOCENTER</p><h1>设备验证</h1><p id="status">正在检查访问权限</p><form id="form" hidden><label for="name">设备名称</label><input id="name" maxlength="80" required placeholder="例如：我的笔记本"><button>申请访问</button></form><code id="request-id"></code><small id="note"></small><button id="refresh">检查审批状态</button></main><script src="/access.js"></script></html>
